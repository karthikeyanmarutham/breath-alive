<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation Test</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f4fbf8 0%, #edf8f7 45%, #f8fcfb 100%);
            font-family: Arial, sans-serif;
        }

        .animation-container {
            width: min(82vw, 820px);
            padding: 24px;
        }

        .animation-box {
            width: 100%;
            display: grid;
            place-items: center;
        }

        .animation-content {
            width: 100%;
        }

        .logo-animate {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
            filter: drop-shadow(0 14px 30px rgba(23, 94, 103, 0.12));
        }

        .logo-animate .svg-elem-1,
        .logo-animate .svg-elem-2,
        .logo-animate .svg-elem-3,
        .logo-animate .svg-elem-4,
        .logo-animate .svg-elem-5,
        .logo-animate .svg-elem-6,
        .logo-animate .svg-elem-7 {
            fill: transparent;
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
        }

        .logo-animate .svg-elem-1 {
            --fill: rgb(78, 185, 125);
            animation: logoReveal 0.75s cubic-bezier(0.47, 0, 0.745, 0.715) forwards 0.2s;
        }

        .logo-animate .svg-elem-2 {
            --fill: rgb(177, 222, 105);
            animation: logoReveal 0.75s cubic-bezier(0.47, 0, 0.745, 0.715) forwards 0.35s;
        }

        .logo-animate .svg-elem-3 {
            --fill: rgb(109, 188, 218);
            animation: logoReveal 0.75s cubic-bezier(0.47, 0, 0.745, 0.715) forwards 0.5s;
        }

        .logo-animate .svg-elem-4 {
            --fill: rgb(77, 184, 191);
            animation: logoReveal 0.75s cubic-bezier(0.47, 0, 0.745, 0.715) forwards 0.65s;
        }

        .logo-animate .svg-elem-5 {
            --fill: rgb(23, 94, 103);
            animation: logoReveal 0.75s cubic-bezier(0.47, 0, 0.745, 0.715) forwards 0.8s;
        }

        .logo-animate .svg-elem-6 {
            --fill: rgb(110, 191, 220);
            animation: logoReveal 0.75s cubic-bezier(0.47, 0, 0.745, 0.715) forwards 0.95s;
        }

        .logo-animate .svg-elem-7 {
            --fill: rgb(39, 140, 151);
            animation: logoReveal 0.8s cubic-bezier(0.47, 0, 0.745, 0.715) forwards 1.1s;
        }

        @keyframes logoReveal {
            0% {
                fill: transparent;
                opacity: 0;
                transform: translateY(14px) scale(0.95);
            }

            30% {
                opacity: 1;
            }

            100% {
                fill: var(--fill);
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-animate .svg-elem-1,
            .logo-animate .svg-elem-2,
            .logo-animate .svg-elem-3,
            .logo-animate .svg-elem-4,
            .logo-animate .svg-elem-5,
            .logo-animate .svg-elem-6,
            .logo-animate .svg-elem-7 {
                animation: none;
                opacity: 1;
                fill: var(--fill);
                transform: none;
            }
        }
    </style>
</head>
